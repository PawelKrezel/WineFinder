{% if user.is_authenticated %}
{% load static %}
<link rel="stylesheet" href="{% static 'wineadmin/css/nav.css' %}">
<nav>
    <div onclick="this.querySelector('form').submit()">
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <span>logout: {{ request.user }}</span>
        </form>
    </div>
    <a href="{% url 'wineadmin' %}"><div>Admin</div></a>
    <a href="{% url 'search' %}"><div>Search</div></a>
    <a href="{% url 'admin:index' %}"><div>Django Administration</div></a>

    
</nav>
{% endif %}
