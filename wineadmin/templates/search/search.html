{% extends "base.html" %}


{% block content %}
<h2>SZNUPEJ</h2>

<form method="GET">
    <input type="text" name="query" placeholder="Search wine, grape, region..." value="{{ query }}">
    <button type="submit">Search</button>
</form>

<hr>
{% for wine in wines %}
    <div>
        <a href="{% url 'wine_detail' wine.id %}">
            {{ wine }}
        </a>
    </div>
{% empty %}
    <p>No wines found.</p>
{% endfor %}


{% endblock %}
