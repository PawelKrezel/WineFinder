{% extends 'base.html' %}

{% block title %} 🪪 Login - Wine Admin - Hawksmoor KB {% endblock %}

{% block content %}

<h1>login</h1>
<form method="POST">
    {% csrf_token %}

    {{ form.username }}
    {{ form.password }}

    <button type="submit" class="commonStyle commonStyleAsBlock">Login</button>
    <button type="reset" class="commonStyle commonStyleAsBlock">Clear</button>
</form>
{% load static %}
<link rel="stylesheet" href="{% static 'wineadmin/css/login.css' %}">
{% endblock %}
